# InfluxDB, Grafana, Mosquitto (MQTT), Flask server — одно окружение
# Запуск: docker compose up -d

services:
  iot-app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: iot-pi-app
    stdin_open: true
    tty: true
    environment:
      PYTHONPATH: /app/docker/rpi_gpio_compat:/app/src
      RPI_GPIO_COMPAT: "1"
      PYTHONUNBUFFERED: "1"
      TERM: xterm-256color
      IOT_MQTT_HOST: mosquitto
      IOT_MQTT_PORT: "1883"
      IOT_INFLUXDB_URL: http://influxdb:8086
    volumes:
      - ./:/app
    depends_on:
      - mosquitto
    networks:
      - iot-net
    command: ["python", "src/main.py"]

  iot-web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: iot-web-app
    environment:
      PYTHONPATH: /app/src
      PYTHONUNBUFFERED: "1"
      IOT_MQTT_HOST: mosquitto
      IOT_MQTT_PORT: "1883"
      IOT_INFLUXDB_URL: http://influxdb:8086
      GRAFANA_URL: http://localhost:3000
    volumes:
      - ./:/app
    ports:
      - "127.0.0.1:5001:5001"
    depends_on:
      - mosquitto
      - influxdb
    networks:
      - iot-net
    command: ["python", "src/server.py"]

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: iot-mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
      - iot-net
    restart: unless-stopped

  influxdb:
    image: influxdb:2.7
    container_name: iot-influxdb
    ports:
      - "127.0.0.1:8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_ORG: FTN
      DOCKER_INFLUXDB_INIT_BUCKET: NTP
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: iot-influx-token
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: adminadmin
    volumes:
      - influxdb-data:/var/lib/influxdb2
    networks:
      - iot-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: iot-grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - iot-net
    depends_on:
      - influxdb
    restart: unless-stopped

volumes:
  influxdb-data:
  grafana-data:

networks:
  iot-net:
    driver: bridge
